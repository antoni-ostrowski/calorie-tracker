steps:
  check:
    image: oven/bun:latest
    commands:
      - bun install --ignore-scripts
      - bun run check
    when:
      - event: pull_request

  build:
    image: docker:27-dind
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t antost360/calorie-tracker:latest .
    when:
      - event: pull_request
